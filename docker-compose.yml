services:
  agent:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AGENT_API_KEY=secret-key-123
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      - redis
    deploy:
      replicas: 3
    networks:
      - agent_net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - agent_net

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    networks:
      - agent_net

volumes:
  redis-data:

networks:
  agent_net:
    driver: bridge
